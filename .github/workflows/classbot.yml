name: Quilo 일정 checks

on:
  push:
    paths:
      - "apps/classbot/**"
      - ".github/workflows/classbot.yml"
  pull_request:
    paths:
      - "apps/classbot/**"
      - ".github/workflows/classbot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/classbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/classbot/package-lock.json
      - run: npm ci
      - run: npm run release:check
