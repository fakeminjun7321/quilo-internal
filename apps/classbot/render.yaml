previews:
  generation: "off"

services:
  - type: web
    name: quilo-schedule
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/classbot
    buildCommand: npm ci --include=dev && npm run build && npm run preflight:production
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: CLASSBOT_STORAGE
        value: supabase
      - key: CLASSBOT_SESSION_SECRET
        generateValue: true
      - key: CLASSBOT_ADMIN_PASSWORD
        sync: false
      - key: CLASSBOT_CRON_SECRET
        generateValue: true
      - key: CLASSBOT_KAKAO_SKILL_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KAKAO_EVENT_ENABLED
        value: "false"
      - key: KAKAO_BOT_ID
        value: 6a57ace9fd013545b6416293
      - key: KAKAO_EVENT_NAME
        value: quilo_schedule_notification
      - key: CLASSBOT_CLASS_CODE
        value: 2-4
      - key: CLASSBOT_CLASS_NAME
        value: 2학년 4반
      - key: CLASSBOT_TIMEZONE
        value: Asia/Seoul
