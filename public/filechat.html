<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="canonical" href="https://quilolab.com/filechat.html" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>파일 챗봇 (Pro) · Quilo</title>
    <meta
      name="description"
      content="파일을 올리고 Claude와 대화하세요. PDF·이미지·표·텍스트를 분석합니다."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .fc-wrap {
        max-width: 860px;
        margin: 0 auto;
      }
      .fc-chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 320px;
        max-height: 56vh;
        overflow-y: auto;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .fc-msg {
        max-width: 86%;
        padding: 10px 14px;
        border-radius: var(--radius);
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
        font-size: 15px;
      }
      .fc-msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--on-accent);
        border-bottom-right-radius: 4px;
      }
      .fc-msg.ai {
        align-self: flex-start;
        background: var(--surface-2);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .fc-msg.empty {
        align-self: center;
        opacity: 0.55;
        font-size: 13px;
        background: none;
      }
      .fc-composer {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        background: var(--surface);
      }
      .fc-files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .fc-file-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        background: var(--surface-2);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .fc-file-chip button {
        border: none;
        background: none;
        cursor: pointer;
        color: var(--danger);
        font-size: 13px;
        line-height: 1;
        padding: 0;
        min-width: 24px;
        min-height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .fc-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .fc-row textarea {
        flex: 1;
        resize: vertical;
        min-height: 46px;
        max-height: 180px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        font: inherit;
        background: var(--surface);
        color: inherit;
      }
      .fc-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .fc-tools select {
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
        font: inherit;
        min-height: 44px;
      }
      .fc-attach-btn {
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 5px 10px;
        font-size: 13px;
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .fc-hint {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 8px;
      }
      .fc-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: var(--fw-semibold);
        color: var(--success);
        margin-left: 6px;
      }
    </style>
  </head>
  <body class="landing">
    <div class="landing-bg" aria-hidden="true"></div>
    <nav class="landing-nav">
      <div class="landing-nav-inner">
        <a href="/" class="brand"
          ><span class="brand-mark" aria-hidden="true">Q</span> Quilo</a
        >
        <div class="landing-nav-actions">
          <a href="/" class="nav-link">메인</a>
          <a href="/tools/index.html" class="nav-link">도구 모음</a>
          <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="다크 모드로 전환"
          >
            <span class="theme-icon-light" aria-hidden="true">🌙</span>
            <span class="theme-icon-dark" aria-hidden="true">☀️</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="landing-shell">
      <section class="section" style="border-top: 0">
        <div class="fc-wrap">
          <div class="tool-page-head">
            <h1>📎 파일 챗봇 <span class="beta-pill">Pro</span></h1>
            <p>
              PDF·이미지·표·텍스트를 올리고 Claude와 대화하세요. 첨부한 파일은
              대화 내내 함께 참고됩니다.
            </p>
          </div>

          <div id="gate" class="card" aria-live="polite">
            <p class="hint">권한 확인 중...</p>
          </div>

          <div id="tool" style="display: none">
            <div
              id="accessNote"
              class="hint"
              style="margin-bottom: 8px"
              aria-live="polite"
            ></div>
            <div
              id="fcChat"
              class="fc-chat"
              role="log"
              aria-live="polite"
              aria-relevant="additions text"
              aria-label="대화 내용"
            >
              <div class="fc-msg empty">
                파일을 올리고 무엇이든 물어보세요. 예) “이 PDF 핵심만 정리해 줘”
              </div>
            </div>

            <div class="fc-composer">
              <div class="fc-tools">
                <label
                  >모델
                  <select id="fcModel">
                    <option value="claude-sonnet-5">Sonnet 5 (빠름)</option>
                    <option value="claude-opus-4-8">Opus 4.8 (정밀)</option>
                  </select>
                </label>
                <label class="fc-attach-btn"
                  >＋ 파일 첨부
                  <input
                    type="file"
                    id="fcFiles"
                    multiple
                    accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv,.tsv,.json,.log,image/*"
                    style="display: none"
                  />
                </label>
                <button id="fcClear" class="secondary compact" type="button">
                  대화 초기화
                </button>
              </div>
              <div
                id="fcFileChips"
                class="fc-files"
                aria-live="polite"
                aria-label="첨부 파일 목록"
              ></div>
              <div class="fc-row">
                <textarea
                  id="fcInput"
                  placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"
                  aria-label="메시지 입력"
                ></textarea>
                <button id="fcSend" class="btn btn-primary" type="button">
                  보내기
                </button>
              </div>
              <p class="fc-hint">
                첨부 파일은 매 메시지마다 함께 전송되어 맥락이 유지됩니다. 파일당
                최대 6개. 서버(관리자) 키로 동작합니다.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/theme.js"></script>
    <script>
      (function () {
        var gate = document.getElementById("gate");
        var tool = document.getElementById("tool");

        function showGate(html) {
          gate.innerHTML = html;
          gate.style.display = "";
          tool.style.display = "none";
        }

        (async function guard() {
          try {
            var res = await fetch("/api/filechat/access");
            if (res.status === 401) {
              showGate(
                '<p class="hint">로그인이 필요합니다.</p><p style="margin-top:12px"><a class="btn btn-primary" href="/login.html">로그인</a></p>'
              );
              return;
            }
            var d = await res.json();
            if (!d.allowed) {
              showGate(
                '<p class="hint">파일 챗봇은 현재 <b>관리자·위임 사용자·Pro 회원</b>만 사용할 수 있습니다. 관리자에게 사용 권한(키 위임 또는 Pro 등록)을 요청하세요.</p>'
              );
              return;
            }
            gate.style.display = "none";
            tool.style.display = "block";
            var note = document.getElementById("accessNote");
            if (d.reason === "grant")
              note.innerHTML =
                '관리자 키 위임으로 사용 중입니다 <span class="fc-badge">무료</span>';
            else if (d.reason === "admin") note.textContent = "관리자 모드";
            else if (d.reason === "beta") note.textContent = "Pro 회원 모드";
            initTool();
          } catch (e) {
            showGate('<p class="hint">권한 확인 중 오류가 발생했습니다.</p>');
          }
        })();

        function initTool() {
          var chatEl = document.getElementById("fcChat");
          var inputEl = document.getElementById("fcInput");
          var sendBtn = document.getElementById("fcSend");
          var fileInput = document.getElementById("fcFiles");
          var chipsEl = document.getElementById("fcFileChips");
          var modelSel = document.getElementById("fcModel");
          var clearBtn = document.getElementById("fcClear");

          var messages = []; // {role, content} — 텍스트 히스토리
          var attached = []; // File 객체
          var busy = false;

          function renderChips() {
            chipsEl.innerHTML = "";
            attached.forEach(function (f, i) {
              var chip = document.createElement("span");
              chip.className = "fc-file-chip";
              chip.textContent = f.name + " ";
              var x = document.createElement("button");
              x.type = "button";
              x.textContent = "✕";
              x.setAttribute("aria-label", f.name + " 첨부 제거");
              x.onclick = function () {
                attached.splice(i, 1);
                renderChips();
              };
              chip.appendChild(x);
              chipsEl.appendChild(chip);
            });
          }

          fileInput.addEventListener("change", function () {
            Array.from(fileInput.files || []).forEach(function (f) {
              if (attached.length < 6) attached.push(f);
            });
            fileInput.value = "";
            renderChips();
          });

          function addBubble(role, text) {
            var empty = chatEl.querySelector(".fc-msg.empty");
            if (empty) empty.remove();
            var b = document.createElement("div");
            b.className = "fc-msg " + (role === "user" ? "user" : "ai");
            b.textContent = text;
            chatEl.appendChild(b);
            chatEl.scrollTop = chatEl.scrollHeight;
            return b;
          }

          clearBtn.addEventListener("click", function () {
            if (busy) return;
            messages = [];
            attached = [];
            renderChips();
            chatEl.innerHTML =
              '<div class="fc-msg empty">대화를 초기화했습니다. 새로 시작하세요.</div>';
          });

          async function send() {
            if (busy) return;
            var text = inputEl.value.trim();
            if (!text && !attached.length) return;
            busy = true;
            sendBtn.disabled = true;
            sendBtn.textContent = "...";

            var shownUser =
              text || "(첨부 파일 " + attached.length + "개)";
            addBubble("user", shownUser);
            inputEl.value = "";

            var fd = new FormData();
            fd.append("messages", JSON.stringify(messages.slice(-10)));
            fd.append("message", text);
            fd.append("model", modelSel.value);
            attached.forEach(function (f) {
              fd.append("files", f, f.name);
            });

            var aiBubble = addBubble("ai", "");
            aiBubble.textContent = "…";
            var acc = "";
            try {
              var resp = await fetch("/api/filechat", {
                method: "POST",
                body: fd,
              });
              if (!resp.ok || !resp.body) {
                var err = await resp.json().catch(function () {
                  return {};
                });
                aiBubble.textContent =
                  "오류: " + (err.error || "응답을 받지 못했습니다.");
                throw new Error(err.error || "request failed");
              }
              var reader = resp.body.getReader();
              var dec = new TextDecoder();
              while (true) {
                var r = await reader.read();
                if (r.done) break;
                acc += dec.decode(r.value, { stream: true });
                aiBubble.textContent = acc;
                chatEl.scrollTop = chatEl.scrollHeight;
              }
              if (!acc) aiBubble.textContent = "(빈 응답)";
              // 히스토리에 반영(텍스트만)
              messages.push({ role: "user", content: shownUser });
              messages.push({ role: "assistant", content: acc || "" });
            } catch (e) {
              if (!acc && aiBubble.textContent === "…")
                aiBubble.textContent = "오류가 발생했습니다. 다시 시도해 주세요.";
            } finally {
              busy = false;
              sendBtn.disabled = false;
              sendBtn.textContent = "보내기";
            }
          }

          sendBtn.addEventListener("click", send);
          inputEl.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              send();
            }
          });
        }
      })();
    </script>
  </body>
</html>
