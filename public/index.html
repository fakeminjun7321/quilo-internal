<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화학 사전보고서 생성기</title>
  </head>
  <body>
    <p>
      <span id="user"></span>
      <a href="/admin" id="adminLink" style="display: none">[관리자]</a>
      <a href="#" id="logout">[로그아웃]</a>
    </p>

    <h1>화학실험 사전보고서 생성기</h1>

    <form id="form">
      <p>
        <label>실험 매뉴얼 PDF:
          <input id="manual" name="manual" type="file" accept="application/pdf" required />
        </label>
      </p>
      <p>
        <label>실험 예정일:
          <input id="date" name="date" type="date" required />
        </label>
      </p>
      <p>
        <button type="submit" id="btn">사전보고서 생성</button>
      </p>
      <p>⏱ 생성에 3~5분 소요됩니다. 페이지를 닫지 마세요.</p>
      <p><small>※ 그림 자리는 점선 박스 안에 구글 이미지 검색 링크가 들어갑니다. docx 열어서 링크 클릭 → 이미지 복붙으로 채우세요.</small></p>
    </form>

    <hr />

    <div id="progressArea" style="display: none">
      <h2 id="statusTitle">생성 중...</h2>
      <pre id="progress" style="background: #eee; padding: 8px; max-height: 300px; overflow: auto"></pre>
      <div id="resultArea"></div>
    </div>

    <script>
      // Confirm session
      fetch("/api/me")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((d) => {
          document.getElementById("user").textContent = d.user + " 님 ";
          if (d.isAdmin) {
            document.getElementById("adminLink").style.display = "inline";
          }
        })
        .catch(() => (location.href = "/login.html"));

      document.getElementById("logout").addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/api/logout", { method: "POST" });
        location.href = "/login.html";
      });

      // Default to today
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);

      const form = document.getElementById("form");
      const btn = document.getElementById("btn");
      const progressArea = document.getElementById("progressArea");
      const progressEl = document.getElementById("progress");
      const resultArea = document.getElementById("resultArea");
      const statusTitle = document.getElementById("statusTitle");

      // PDF 크기 기반 예상 비용 추정
      // (Claude Opus 기준: 입력 토큰 + 출력 ~12K + 웹검색 평균 3회)
      function estimateCost(pdfBytes) {
        const sizeKB = pdfBytes / 1024;
        // 입력: PDF는 페이지당 ~1500토큰. 1KB ≈ 0.5KB/페이지 가정 → 매우 보수적
        // 시스템 프롬프트 ~10K + PDF 토큰
        const inputTokensLo = 15000 + sizeKB * 80;
        const inputTokensHi = 20000 + sizeKB * 200;
        const outputTokensLo = 8000;
        const outputTokensHi = 14000;
        const webSearchLo = 1;
        const webSearchHi = 5;

        const lo =
          (inputTokensLo / 1e6) * 15 +
          (outputTokensLo / 1e6) * 75 +
          webSearchLo * 0.01;
        const hi =
          (inputTokensHi / 1e6) * 15 +
          (outputTokensHi / 1e6) * 75 +
          webSearchHi * 0.01;
        return { lo, hi, sizeKB: Math.round(sizeKB) };
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const file = document.getElementById("manual").files[0];
        if (!file) return;

        // 예상 비용 확인
        const est = estimateCost(file.size);
        const krwLo = Math.round(est.lo * 1400);
        const krwHi = Math.round(est.hi * 1400);
        const msg =
          `📄 PDF 크기: ${est.sizeKB}KB\n` +
          `💰 예상 비용: $${est.lo.toFixed(2)} ~ $${est.hi.toFixed(2)} ` +
          `(약 ₩${krwLo.toLocaleString()} ~ ₩${krwHi.toLocaleString()})\n\n` +
          `생성하시겠습니까? (실제 비용은 완료 후 표시됩니다)`;
        if (!confirm(msg)) return;

        btn.disabled = true;
        btn.textContent = "생성 중...";
        progressArea.style.display = "block";
        progressEl.textContent = "";
        resultArea.innerHTML = "";
        statusTitle.textContent = "생성 중...";

        const fd = new FormData();
        fd.append("manual", file);
        const dateStr = document.getElementById("date").value;
        const [y, m, d] = dateStr.split("-");
        fd.append("date", `${y}/ ${m} / ${d}`);

        try {
          const res = await fetch("/api/generate", { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "요청 실패");
          streamJob(data.jobId);
        } catch (err) {
          appendLine("❌ " + err.message);
          resetForm();
        }
      });

      function appendLine(text) {
        progressEl.textContent += text + "\n";
        progressEl.scrollTop = progressEl.scrollHeight;
      }

      function resetForm() {
        btn.disabled = false;
        btn.textContent = "사전보고서 생성";
      }

      function streamJob(jobId) {
        const es = new EventSource(`/api/jobs/${jobId}/stream`);

        es.addEventListener("progress", (e) => {
          appendLine(JSON.parse(e.data));
        });

        es.addEventListener("done", (e) => {
          const data = JSON.parse(e.data);
          appendLine("✅ 완료");
          statusTitle.textContent = "완료";

          const link = document.createElement("a");
          link.href = `/api/jobs/${jobId}/download`;
          link.textContent = `📥 ${data.filename} 다운로드`;
          link.download = data.filename;
          resultArea.appendChild(link);

          es.close();
          resetForm();
        });

        es.addEventListener("error", (e) => {
          const msg = e.data ? JSON.parse(e.data) : "스트리밍 오류";
          appendLine("❌ " + msg);
          statusTitle.textContent = "오류";
          es.close();
          resetForm();
        });
      }
    </script>
  </body>
</html>
