  <script>
    (() => {
      window.__timelines = window.__timelines || {};

      const root = document.querySelector('[data-composition-id="03-analysis"]');
      const target = document.getElementById("hf03-state-result");
      const rootRect = root.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const rootScaleX = rootRect.width / 1920 || 1;
      const rootScaleY = rootRect.height / 1080 || 1;
      const targetOffsetX =
        (targetRect.left + targetRect.width / 2 - (rootRect.left + rootRect.width / 2)) /
        rootScaleX;
      const targetOffsetY =
        (targetRect.top + targetRect.height / 2 - (rootRect.top + rootRect.height / 2)) /
        rootScaleY;
      const targetWidth = targetRect.width / rootScaleX;
      const targetHeight = targetRect.height / rootScaleY;
      const maxZoom = Math.min((0.88 * 1920) / targetWidth, (0.88 * 1080) / targetHeight);
      const zoomScale = Math.min(1.55, maxZoom);

      const links = Array.from(document.querySelectorAll(".hf03-link"));
      links.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const tl = gsap.timeline({ paused: true });
      const drift = { phase: 0 };

      tl.fromTo(
        "#hf03-zoom-outer",
        { scale: 0.97 },
        { scale: 1, duration: 1.35, ease: "power2.out" },
        0,
      );
      tl.to(
        drift,
        {
          phase: Math.PI * 2,
          duration: 7,
          ease: "none",
          onUpdate: () => {
            const x = Math.sin(drift.phase) * 4;
            const y = Math.sin(drift.phase * 1.3) * 2;
            document.getElementById("hf03-drift").style.transform = `translate(${x}px, ${y}px)`;
          },
        },
        0,
      );

      tl.fromTo(
        "#hf03-chrome",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        "#hf03-hub",
        { opacity: 0.45, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        "#hf03-hub-ring-one",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
        0.15,
      );
      tl.fromTo(
        "#hf03-hub-ring-two",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
        0.35,
      );

      [
        ["#hf03-file-node-xlsx", 0.05],
        ["#hf03-file-node-pdf", 0.28],
        ["#hf03-file-node-md", 0.51],
      ].forEach(([selector, at]) => {
        tl.fromTo(
          selector,
          { opacity: 0, y: 22, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power3.out" },
          at,
        );
      });

      const drawPath = (selector, at, duration) => {
        tl.to(
          selector,
          { strokeDashoffset: 0, opacity: 1, duration, ease: "power2.out" },
          at,
        );
      };

      drawPath("#hf03-path-file-xlsx", 1.5, 0.46);
      drawPath("#hf03-path-file-pdf", 1.94, 0.46);
      tl.to(
        "#hf03-file-node-xlsx",
        { "--dof": "4px", opacity: 0.58, duration: 0.44, ease: "power2.inOut" },
        1.94,
      );
      drawPath("#hf03-path-file-md", 2.38, 0.46);
      tl.to(
        "#hf03-file-node-pdf",
        { "--dof": "4px", opacity: 0.58, duration: 0.44, ease: "power2.inOut" },
        2.38,
      );
      tl.to(
        "#hf03-file-node-md",
        { "--dof": "4px", opacity: 0.58, duration: 0.44, ease: "power2.inOut" },
        2.82,
      );

      const stages = [
        {
          node: "#hf03-state-structure",
          path: "#hf03-path-structure",
          meter: "#hf03-meter-structure",
          at: 2.62,
        },
        {
          node: "#hf03-state-normalize",
          path: "#hf03-path-normalize",
          meter: "#hf03-meter-normalize",
          at: 3.17,
        },
        {
          node: "#hf03-state-evidence",
          path: "#hf03-path-evidence",
          meter: "#hf03-meter-evidence",
          at: 3.72,
        },
        {
          node: "#hf03-state-result",
          path: "#hf03-path-result",
          meter: "#hf03-meter-result",
          at: 4.27,
        },
      ];

      stages.forEach((stage, index) => {
        drawPath(stage.path, stage.at, 0.46);
        tl.fromTo(
          stage.node,
          { opacity: 0, y: 18, scale: 0.94, "--dof": "5px" },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            "--dof": "0px",
            duration: 0.5,
            ease: "power3.out",
          },
          stage.at + 0.08,
        );
        tl.fromTo(
          stage.meter,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.48, ease: "power2.out" },
          stage.at + 0.18,
        );
        if (index > 0) {
          tl.to(
            stages[index - 1].node,
            { "--dof": "4px", opacity: 0.56, duration: 0.44, ease: "power2.inOut" },
            stage.at,
          );
        }
      });

      const contextLayers = [
        "#hf03-file-node-xlsx",
        "#hf03-file-node-pdf",
        "#hf03-file-node-md",
        "#hf03-hub",
        "#hf03-state-structure",
        "#hf03-state-normalize",
        "#hf03-state-evidence",
      ];

      contextLayers.forEach((selector) => {
        const element = document.querySelector(selector);
        const depth = Number(element.dataset.depth) || 1;
        tl.to(
          selector,
          {
            "--dof": `${Math.min(depth * 5, 16)}px`,
            opacity: 0.28,
            duration: 1.2,
            ease: "power2.inOut",
          },
          4.8,
        );
      });

      tl.to(
        ".hf03-context-path",
        { opacity: 0.12, duration: 1.2, ease: "power2.inOut" },
        4.8,
      );
      tl.to(
        "#hf03-path-result",
        { opacity: 1, duration: 1.2, ease: "power2.inOut" },
        4.8,
      );
      tl.to(
        "#hf03-chrome",
        { opacity: 0.32, duration: 1.2, ease: "power2.inOut" },
        4.8,
      );
      tl.to(
        "#hf03-zoom-outer",
        { scale: zoomScale, duration: 1.2, ease: "power3.inOut" },
        4.8,
      );
      tl.to(
        "#hf03-zoom-inner",
        {
          x: -targetOffsetX,
          y: -targetOffsetY,
          duration: 1.2,
          ease: "power3.inOut",
        },
        4.8,
      );
      tl.fromTo(
        "#hf03-result-status",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        5.92,
      );

      window.__timelines["03-analysis"] = tl;
    })();
