<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Pretendard";
          src: url("assets/fonts/Pretendard-Regular.ttf") format("truetype");
          font-style: normal;
          font-weight: 400;
          font-display: block;
        }

        @font-face {
          font-family: "Pretendard";
          src: url("assets/fonts/Pretendard-Bold.ttf") format("truetype");
          font-style: normal;
          font-weight: 700;
          font-display: block;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          color: #121a2a;
          font-family: "Pretendard", sans-serif;
          -webkit-font-smoothing: antialiased;
          text-rendering: geometricPrecision;
        }

        #root,
        #root * {
          box-sizing: border-box;
        }

        .hf04-ground,
        .hf04-stage {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }

        .hf04-ground {
          background: #ffffff;
        }

        .hf04-stage {
          z-index: 2;
          overflow: hidden;
        }

        .hf04-camera {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          transform-origin: 58% 44%;
          will-change: transform;
        }

        .hf04-layout {
          position: absolute;
          top: 72px;
          left: 86px;
          width: 1748px;
          height: 760px;
          display: grid;
          grid-template-columns: 1114px 588px;
          column-gap: 46px;
          align-items: center;
        }

        .hf04-chart-card {
          position: relative;
          width: 1114px;
          height: 720px;
          overflow: hidden;
          border: 1.5px solid rgba(33, 95, 229, 0.2);
          border-radius: 14px;
          background: rgba(33, 95, 229, 0.04);
          will-change: transform, opacity;
        }

        .hf04-chart-accent {
          position: absolute;
          z-index: 3;
          top: 34px;
          left: 38px;
          display: block;
          width: 60px;
          height: 4px;
          border-radius: 2px;
          background: #215fe5;
          transform-origin: 0 50%;
          will-change: transform;
        }

        .hf04-chart {
          position: absolute;
          inset: 38px 34px 26px 34px;
          width: 1046px;
          height: 656px;
          overflow: visible;
        }

        .hf04-grid-path {
          fill: none;
          stroke: rgba(33, 95, 229, 0.12);
          stroke-width: 1.5;
          stroke-linecap: round;
        }

        .hf04-axis-path {
          fill: none;
          stroke: #121a2a;
          stroke-width: 3;
          stroke-linecap: round;
        }

        .hf04-fit-path {
          fill: none;
          stroke: #215fe5;
          stroke-width: 5;
          stroke-linecap: round;
        }

        .hf04-axis-label {
          fill: #5d6879;
          font-family: "Pretendard", sans-serif;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.02em;
          will-change: transform, opacity;
        }

        .hf04-tick-label {
          fill: #5d6879;
          font-family: "Pretendard", sans-serif;
          font-size: 17px;
          font-weight: 400;
          font-variant-numeric: tabular-nums;
          text-anchor: middle;
          will-change: transform, opacity;
        }

        .hf04-point {
          transform-box: fill-box;
          transform-origin: center;
          will-change: transform, opacity;
        }

        .hf04-point-ring {
          fill: #ffffff;
          stroke: rgba(33, 95, 229, 0.2);
          stroke-width: 8;
        }

        .hf04-point-core {
          fill: #215fe5;
        }

        .hf04-point-tick {
          fill: none;
          stroke: #215fe5;
          stroke-width: 3;
          stroke-linecap: round;
        }

        .hf04-result-column {
          position: relative;
          width: 588px;
          height: 560px;
          display: grid;
          place-items: center;
        }

        .hf04-result-glow {
          position: absolute;
          z-index: 0;
          top: -120px;
          right: -150px;
          bottom: -120px;
          left: -150px;
          background: radial-gradient(
            ellipse at center,
            rgba(33, 95, 229, 0.28) 0%,
            rgba(33, 95, 229, 0.12) 34%,
            rgba(33, 95, 229, 0) 72%
          );
          transform-origin: 50% 50%;
          pointer-events: none;
          will-change: transform, opacity;
        }

        .hf04-result-card {
          position: relative;
          z-index: 2;
          width: 548px;
          min-height: 468px;
          padding: 46px 44px 42px;
          border: 1.5px solid rgba(33, 95, 229, 0.2);
          border-radius: 14px;
          background: rgba(33, 95, 229, 0.04);
          will-change: transform, opacity;
        }

        .hf04-metric-row {
          display: flex;
          width: 100%;
          min-height: 138px;
          align-items: baseline;
          justify-content: center;
          gap: 18px;
          color: #215fe5;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }

        .hf04-metric-prefix {
          display: inline-block;
          font-size: 52px;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.04em;
        }

        .hf04-metric-number-wrap {
          display: inline-flex;
          width: 250px;
          height: 108px;
          align-items: baseline;
          justify-content: flex-start;
        }

        .hf04-metric-number {
          display: inline-block;
          color: #215fe5;
          font-size: 88px;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.055em;
          font-variant-numeric: tabular-nums;
          transform-origin: 0 100%;
          will-change: transform, opacity;
        }

        .hf04-result-rule {
          display: block;
          width: 100%;
          height: 1.5px;
          margin: 12px 0 34px;
          background: rgba(33, 95, 229, 0.2);
          transform-origin: 0 50%;
          will-change: transform;
        }

        .hf04-finding {
          min-height: 172px;
          color: #121a2a;
          font-size: 43px;
          font-weight: 700;
          line-height: 1.32;
          letter-spacing: -0.045em;
        }

        .hf04-finding-phrase {
          display: block;
          will-change: transform, opacity;
        }

        .hf04-progress {
          position: absolute;
          z-index: 12;
          top: 884px;
          left: 96px;
          width: 1728px;
          height: 3px;
          overflow: hidden;
          background: rgba(33, 95, 229, 0.08);
        }

        .hf04-progress-fill {
          display: block;
          width: 57.14%;
          height: 100%;
          background: #215fe5;
          transform-origin: 0 50%;
          will-change: transform;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-data"
        data-start="0"
        data-duration="7.35"
        data-width="1920"
        data-height="1080"
      >
        <div
          id="hf04-ground"
          class="clip hf04-ground"
          data-start="0"
          data-duration="7.35"
          data-track-index="0"
          aria-hidden="true"
        ></div>

        <div
          id="hf04-stage"
          class="clip hf04-stage"
          data-start="0"
          data-duration="7.35"
          data-track-index="1"
        >
          <div id="hf04-camera" class="hf04-camera">
            <div class="hf04-layout">
              <section id="hf04-chart-card" class="hf04-chart-card">
                <span id="hf04-chart-accent" class="hf04-chart-accent"></span>
                <svg
                  class="hf04-chart"
                  viewBox="0 0 1000 620"
                  xmlns="http://www.w3.org/2000/svg"
                  role="img"
                  aria-label="m과 T의 산점도"
                >
                  <path id="hf04-grid-h1" class="hf04-grid-path" d="M 120 450 H 900" />
                  <path id="hf04-grid-h2" class="hf04-grid-path" d="M 120 360 H 900" />
                  <path id="hf04-grid-h3" class="hf04-grid-path" d="M 120 270 H 900" />
                  <path id="hf04-grid-h4" class="hf04-grid-path" d="M 120 180 H 900" />
                  <path id="hf04-grid-h5" class="hf04-grid-path" d="M 120 90 H 900" />

                  <path id="hf04-grid-v1" class="hf04-grid-path" d="M 160 530 V 70" />
                  <path id="hf04-grid-v2" class="hf04-grid-path" d="M 335 530 V 70" />
                  <path id="hf04-grid-v3" class="hf04-grid-path" d="M 510 530 V 70" />
                  <path id="hf04-grid-v4" class="hf04-grid-path" d="M 685 530 V 70" />
                  <path id="hf04-grid-v5" class="hf04-grid-path" d="M 860 530 V 70" />

                  <path id="hf04-axis-x" class="hf04-axis-path" d="M 120 530 H 900" />
                  <path id="hf04-axis-y" class="hf04-axis-path" d="M 120 530 V 70" />

                  <text id="hf04-label-y" class="hf04-axis-label" x="72" y="66">T (s)</text>
                  <text id="hf04-label-x" class="hf04-axis-label" x="828" y="596">m (kg)</text>

                  <text id="hf04-tick-x1" class="hf04-tick-label" x="160" y="568">0.1</text>
                  <text id="hf04-tick-x2" class="hf04-tick-label" x="335" y="568">0.2</text>
                  <text id="hf04-tick-x3" class="hf04-tick-label" x="510" y="568">0.3</text>
                  <text id="hf04-tick-x4" class="hf04-tick-label" x="685" y="568">0.4</text>
                  <text id="hf04-tick-x5" class="hf04-tick-label" x="860" y="568">0.5</text>

                  <path id="hf04-fit-line" class="hf04-fit-path" d="M 160 454 L 860 96" />

                  <g id="hf04-point-1" class="hf04-point">
                    <circle class="hf04-point-ring" cx="160" cy="450" r="15" />
                    <circle class="hf04-point-core" cx="160" cy="450" r="8" />
                  </g>
                  <path id="hf04-point-tick-1" class="hf04-point-tick" d="M 176 440 L 190 428" />

                  <g id="hf04-point-2" class="hf04-point">
                    <circle class="hf04-point-ring" cx="335" cy="390" r="15" />
                    <circle class="hf04-point-core" cx="335" cy="390" r="8" />
                  </g>
                  <path id="hf04-point-tick-2" class="hf04-point-tick" d="M 351 380 L 365 368" />

                  <g id="hf04-point-3" class="hf04-point">
                    <circle class="hf04-point-ring" cx="510" cy="310" r="15" />
                    <circle class="hf04-point-core" cx="510" cy="310" r="8" />
                  </g>
                  <path id="hf04-point-tick-3" class="hf04-point-tick" d="M 526 300 L 540 288" />

                  <g id="hf04-point-4" class="hf04-point">
                    <circle class="hf04-point-ring" cx="685" cy="205" r="15" />
                    <circle class="hf04-point-core" cx="685" cy="205" r="8" />
                  </g>
                  <path id="hf04-point-tick-4" class="hf04-point-tick" d="M 701 195 L 715 183" />

                  <g id="hf04-point-5" class="hf04-point">
                    <circle class="hf04-point-ring" cx="860" cy="95" r="15" />
                    <circle class="hf04-point-core" cx="860" cy="95" r="8" />
                  </g>
                  <path id="hf04-point-tick-5" class="hf04-point-tick" d="M 876 85 L 890 73" />
                </svg>
              </section>

              <aside class="hf04-result-column">
                <div id="hf04-result-glow" class="hf04-result-glow"></div>
                <div id="hf04-result-card" class="hf04-result-card">
                  <div class="hf04-metric-row">
                    <span class="hf04-metric-prefix">R²</span>
                    <span class="hf04-metric-number-wrap">
                      <span id="hf04-metric-number" class="hf04-metric-number">0.00</span>
                    </span>
                  </div>
                  <span id="hf04-result-rule" class="hf04-result-rule"></span>
                  <div class="hf04-finding">
                    <span id="hf04-finding-one" class="hf04-finding-phrase">질량이 증가할수록</span>
                    <span id="hf04-finding-two" class="hf04-finding-phrase">주기가 증가</span>
                  </div>
                </div>
              </aside>
            </div>

            <div class="hf04-progress" aria-hidden="true">
              <span id="hf04-progress-fill" class="hf04-progress-fill"></span>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const root04 = document.querySelector('[data-composition-id="04-data"]');
          const one04 = (selector) => root04.querySelector(selector);
          const all04 = (selector) => Array.from(root04.querySelectorAll(selector));

          const gridPaths04 = all04('.hf04-grid-path');
          const axisPaths04 = all04('.hf04-axis-path');
          const tickPaths04 = all04('.hf04-point-tick');
          const fitPath04 = one04('#hf04-fit-line');
          const drawablePaths04 = [...gridPaths04, ...axisPaths04, ...tickPaths04, fitPath04];

          drawablePaths04.forEach((path) => {
            const length = path.getTotalLength();
            path.style.strokeDasharray = String(length);
            path.style.strokeDashoffset = String(length);
          });

          const timeline04 = gsap.timeline({ paused: true });
          const metric04 = one04('#hf04-metric-number');
          const metricState04 = { value: 0 };

          timeline04.set(
            [
              ...all04('.hf04-axis-label'),
              ...all04('.hf04-tick-label'),
              ...all04('.hf04-point'),
              one04('#hf04-result-card'),
              one04('#hf04-finding-one'),
              one04('#hf04-finding-two'),
              one04('#hf04-result-glow')
            ],
            { opacity: 0 },
            0
          );
          timeline04.set(all04('.hf04-point'), { scale: 0.3 }, 0);
          timeline04.set(one04('#hf04-result-glow'), { scale: 0.84 }, 0);

          timeline04.fromTo(
            one04('#hf04-chart-card'),
            { opacity: 0.42, y: 14, scale: 0.992 },
            { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: 'power3.out' },
            0
          );
          timeline04.fromTo(
            one04('#hf04-chart-accent'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: 'power3.out' },
            0.06
          );
          timeline04.fromTo(
            one04('#hf04-progress-fill'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.75, ease: 'power2.out' },
            0.08
          );

          gridPaths04.forEach((path, index) => {
            timeline04.to(
              path,
              {
                strokeDashoffset: 0,
                duration: 0.5,
                ease: 'power2.out'
              },
              0.08 + index * 0.045
            );
          });

          timeline04.to(
            one04('#hf04-axis-x'),
            { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' },
            0.18
          );
          timeline04.to(
            one04('#hf04-axis-y'),
            { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' },
            0.46
          );

          timeline04.fromTo(
            all04('.hf04-axis-label'),
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.09 },
            0.86
          );
          timeline04.fromTo(
            all04('.hf04-tick-label'),
            { opacity: 0, y: 7 },
            { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.055 },
            0.96
          );

          const pointBeats04 = [1.3, 1.75, 2.2, 2.65, 3.1];
          pointBeats04.forEach((at, index) => {
            const point = one04(`#hf04-point-${index + 1}`);
            const tick = one04(`#hf04-point-tick-${index + 1}`);
            timeline04.fromTo(
              point,
              { opacity: 0, scale: 0.3 },
              { opacity: 1, scale: 1, duration: 0.34, ease: 'power3.out', immediateRender: false },
              at
            );
            timeline04.to(
              tick,
              { strokeDashoffset: 0, duration: 0.24, ease: 'power2.out' },
              at + 0.14
            );
          });

          timeline04.to(
            one04('#hf04-camera'),
            { x: -14, scale: 1.012, duration: 1.75, ease: 'power2.inOut' },
            3.8
          );
          timeline04.to(
            fitPath04,
            { strokeDashoffset: 0, duration: 0.82, ease: 'power2.out' },
            3.8
          );
          timeline04.fromTo(
            one04('#hf04-result-card'),
            { opacity: 0, y: 22, scale: 0.98 },
            { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: 'power3.out', immediateRender: false },
            3.9
          );
          timeline04.fromTo(
            one04('#hf04-result-rule'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.48, ease: 'power2.out' },
            4.12
          );

          timeline04.to(
            metricState04,
            {
              value: 0.98,
              duration: 1.2,
              ease: 'power3.out',
              onUpdate: () => {
                metric04.textContent = metricState04.value.toFixed(2);
              }
            },
            4.02
          );
          timeline04.fromTo(
            metric04,
            { scale: 0.55, opacity: 0.72 },
            { scale: 1, opacity: 1, duration: 1.2, ease: 'power3.out' },
            4.02
          );

          timeline04.fromTo(
            one04('#hf04-finding-one'),
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out', immediateRender: false },
            4.62
          );
          timeline04.fromTo(
            one04('#hf04-finding-two'),
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out', immediateRender: false },
            5.08
          );

          timeline04.fromTo(
            one04('#hf04-result-glow'),
            { opacity: 0, scale: 0.84 },
            { opacity: 0.22, scale: 1, duration: 0.62, ease: 'power2.out', immediateRender: false },
            5.7
          );

          window.__timelines['04-data'] = timeline04;
        })();
      </script>
    </template>
  </body>
</html>
