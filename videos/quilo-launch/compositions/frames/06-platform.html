<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Pretendard";
          src: url("assets/fonts/Pretendard-Regular.ttf") format("truetype");
          font-style: normal;
          font-weight: 400;
          font-display: block;
        }

        @font-face {
          font-family: "Pretendard";
          src: url("assets/fonts/Pretendard-Bold.ttf") format("truetype");
          font-style: normal;
          font-weight: 700;
          font-display: block;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          color: #121a2a;
          font-family: "Pretendard", sans-serif;
          -webkit-font-smoothing: antialiased;
          text-rendering: geometricPrecision;
        }

        #root,
        #root * {
          box-sizing: border-box;
        }

        .f06-ground {
          position: absolute;
          inset: 0;
          z-index: 0;
          background: #ffffff;
        }

        .f06-stage {
          position: absolute;
          inset: 0;
          z-index: 1;
        }

        .f06-camera {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 840px;
          transform-origin: 960px 420px;
          will-change: transform;
        }

        .f06-connector-plane {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 840px;
          overflow: visible;
        }

        .f06-connector {
          fill: none;
          stroke: rgba(33, 95, 229, 0.22);
          stroke-width: 2.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .f06-hub-ring {
          fill: none;
          stroke: rgba(33, 95, 229, 0.13);
          stroke-width: 2;
        }

        .f06-swap-wrap {
          position: absolute;
          top: 240px;
          left: 680px;
          width: 560px;
          height: 360px;
        }

        .f06-swap-state {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        .f06-report-canvas {
          z-index: 1;
          overflow: hidden;
          padding: 34px;
          border: 1.5px solid rgba(33, 95, 229, 0.2);
          border-radius: 14px;
          background: rgba(33, 95, 229, 0.04);
        }

        .f06-report-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 24px;
        }

        .f06-report-kicker {
          color: #215fe5;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 0.08em;
        }

        .f06-report-page {
          color: #9a9a9a;
          font-size: 14px;
          font-weight: 400;
        }

        .f06-report-title {
          max-width: 430px;
          margin: 0 0 26px;
          color: #121a2a;
          font-size: 42px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.03em;
        }

        .f06-report-body {
          display: grid;
          grid-template-columns: 1.2fr 0.8fr;
          gap: 20px;
        }

        .f06-chart {
          position: relative;
          height: 174px;
          overflow: hidden;
          border: 1.5px solid rgba(33, 95, 229, 0.16);
          border-radius: 12px;
          background: #ffffff;
        }

        .f06-chart-axis-x,
        .f06-chart-axis-y {
          position: absolute;
          display: block;
          background: rgba(93, 104, 121, 0.22);
        }

        .f06-chart-axis-x {
          right: 20px;
          bottom: 24px;
          left: 30px;
          height: 1.5px;
        }

        .f06-chart-axis-y {
          top: 24px;
          bottom: 24px;
          left: 30px;
          width: 1.5px;
        }

        .f06-chart-line {
          position: absolute;
          top: 72px;
          left: 47px;
          display: block;
          width: 184px;
          height: 5px;
          border-radius: 6px;
          background: #215fe5;
          transform: rotate(-23deg);
          transform-origin: 0 50%;
        }

        .f06-chart-dot {
          position: absolute;
          display: block;
          width: 13px;
          height: 13px;
          border: 3px solid #ffffff;
          border-radius: 50%;
          background: #215fe5;
        }

        .f06-chart-dot-one {
          top: 110px;
          left: 62px;
        }

        .f06-chart-dot-two {
          top: 81px;
          left: 130px;
        }

        .f06-chart-dot-three {
          top: 49px;
          left: 205px;
        }

        .f06-summary-lines {
          display: flex;
          flex-direction: column;
          gap: 15px;
          padding-top: 9px;
        }

        .f06-summary-line {
          display: block;
          height: 8px;
          border-radius: 6px;
          background: rgba(93, 104, 121, 0.18);
        }

        .f06-summary-line:nth-child(1) {
          width: 100%;
        }

        .f06-summary-line:nth-child(2) {
          width: 82%;
        }

        .f06-summary-line:nth-child(3) {
          width: 94%;
        }

        .f06-summary-line:nth-child(4) {
          width: 63%;
        }

        .f06-summary-tag {
          align-self: flex-start;
          margin-top: 8px;
          padding: 9px 15px;
          border-radius: 100px;
          background: rgba(33, 95, 229, 0.08);
          color: #215fe5;
          font-size: 15px;
          font-weight: 700;
        }

        .f06-logo-state {
          z-index: 2;
          display: grid;
          place-items: center;
        }

        .f06-logo-frame {
          position: relative;
          display: grid;
          width: 178px;
          height: 178px;
          place-items: center;
        }

        .f06-logo-frame::before {
          position: absolute;
          inset: -24px;
          border: 1.5px solid rgba(33, 95, 229, 0.16);
          border-radius: 50%;
          content: "";
        }

        .f06-logo {
          display: block;
          width: 178px;
          height: 178px;
          object-fit: contain;
        }

        .f06-node {
          position: absolute;
          top: 50%;
          left: 50%;
          z-index: 3;
          display: flex;
          width: 248px;
          height: 84px;
          align-items: center;
          gap: 16px;
          padding: 10px 22px 10px 12px;
          border: 1.5px solid rgba(33, 95, 229, 0.2);
          border-radius: 100px;
          background: rgba(33, 95, 229, 0.04);
          color: #121a2a;
          font-size: 28px;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.025em;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        .f06-node-wide {
          width: 286px;
        }

        .f06-node-icon {
          display: grid;
          width: 58px;
          height: 58px;
          flex: 0 0 58px;
          place-items: center;
          border-radius: 50%;
          background: rgba(33, 95, 229, 0.08);
          color: #215fe5;
        }

        .f06-node-icon svg {
          display: block;
          width: 31px;
          height: 31px;
          overflow: visible;
        }

        .f06-node-icon path,
        .f06-node-icon rect,
        .f06-node-icon line,
        .f06-node-icon polyline {
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .f06-final-line {
          position: absolute;
          top: 70px;
          left: 0;
          z-index: 5;
          width: 1920px;
          color: #121a2a;
          font-size: 64px;
          font-weight: 700;
          line-height: 1.05;
          letter-spacing: -0.035em;
          text-align: center;
        }

        .f06-final-accent {
          display: block;
          width: 60px;
          height: 4px;
          margin: 0 auto 18px;
          border-radius: 2px;
          background: #215fe5;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-platform"
        data-width="1920"
        data-height="1080"
        data-duration="6.9"
      >
        <div
          id="f06-platform-ground"
          class="clip f06-ground"
          data-start="0"
          data-duration="6.9"
          data-track-index="0"
          aria-hidden="true"
        ></div>

        <div
          id="f06-platform-stage"
          class="clip f06-stage"
          data-start="0"
          data-duration="6.9"
          data-track-index="1"
        >
          <div id="f06-platform-camera" class="f06-camera">
            <svg
              class="f06-connector-plane"
              viewBox="0 0 1920 840"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <circle id="f06-platform-hub-ring" class="f06-hub-ring" cx="960" cy="420" r="126" />
              <path
                id="f06-platform-path-report"
                class="f06-connector"
                d="M 960 420 C 788 406, 648 278, 440 230"
              />
              <path
                id="f06-platform-path-pdf"
                class="f06-connector"
                d="M 960 420 C 1132 404, 1278 286, 1460 250"
              />
              <path
                id="f06-platform-path-study"
                class="f06-connector"
                d="M 960 420 C 760 440, 620 548, 420 570"
              />
              <path
                id="f06-platform-path-tools"
                class="f06-connector"
                d="M 960 420 C 1168 442, 1300 552, 1490 580"
              />
              <path
                id="f06-platform-path-api"
                class="f06-connector"
                d="M 960 420 C 958 534, 960 638, 960 730"
              />
            </svg>

            <div class="f06-swap-wrap">
              <div id="f06-platform-report" class="f06-swap-state f06-report-canvas">
                <div class="f06-report-head">
                  <span class="f06-report-kicker">QUILO REPORT</span>
                  <span class="f06-report-page">01 / 04</span>
                </div>
                <h2 class="f06-report-title">실험 결과 분석</h2>
                <div class="f06-report-body">
                  <div class="f06-chart" aria-hidden="true">
                    <span class="f06-chart-axis-x"></span>
                    <span class="f06-chart-axis-y"></span>
                    <span class="f06-chart-line"></span>
                    <span class="f06-chart-dot f06-chart-dot-one"></span>
                    <span class="f06-chart-dot f06-chart-dot-two"></span>
                    <span class="f06-chart-dot f06-chart-dot-three"></span>
                  </div>
                  <div class="f06-summary-lines" aria-hidden="true">
                    <span class="f06-summary-line"></span>
                    <span class="f06-summary-line"></span>
                    <span class="f06-summary-line"></span>
                    <span class="f06-summary-line"></span>
                    <span class="f06-summary-tag">완성됨</span>
                  </div>
                </div>
              </div>

              <div id="f06-platform-logo-state" class="f06-swap-state f06-logo-state">
                <div class="f06-logo-frame">
                  <img
                    id="f06-platform-logo"
                    class="f06-logo"
                    src="assets/quilo-logo.png"
                    alt="Quilo"
                  />
                </div>
              </div>
            </div>

            <div
              id="f06-platform-node-report"
              class="f06-node"
              data-target-x="-520"
              data-target-y="-190"
            >
              <span class="f06-node-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M 9 4 H 20 L 25 9 V 28 H 9 Z" />
                  <path d="M 20 4 V 10 H 25" />
                  <line x1="13" y1="16" x2="21" y2="16" />
                  <line x1="13" y1="21" x2="21" y2="21" />
                </svg>
              </span>
              <span>보고서</span>
            </div>

            <div
              id="f06-platform-node-pdf"
              class="f06-node f06-node-wide"
              data-target-x="500"
              data-target-y="-170"
            >
              <span class="f06-node-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M 5 10 H 22" />
                  <polyline points="18,6 22,10 18,14" />
                  <path d="M 27 22 H 10" />
                  <polyline points="14,18 10,22 14,26" />
                </svg>
              </span>
              <span>PDF 통번역</span>
            </div>

            <div
              id="f06-platform-node-study"
              class="f06-node"
              data-target-x="-540"
              data-target-y="150"
            >
              <span class="f06-node-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M 4 7 C 10 5, 14 7, 16 10 V 27 C 14 24, 10 23, 4 25 Z" />
                  <path d="M 28 7 C 22 5, 18 7, 16 10 V 27 C 18 24, 22 23, 28 25 Z" />
                </svg>
              </span>
              <span>학습</span>
            </div>

            <div
              id="f06-platform-node-tools"
              class="f06-node f06-node-wide"
              data-target-x="530"
              data-target-y="160"
            >
              <span class="f06-node-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <rect x="4" y="5" width="24" height="22" rx="3" />
                  <line x1="4" y1="11" x2="28" y2="11" />
                  <path d="M 12 17 L 9 20 L 12 23" />
                  <path d="M 20 17 L 23 20 L 20 23" />
                </svg>
              </span>
              <span>브라우저 도구</span>
            </div>

            <div
              id="f06-platform-node-api"
              class="f06-node"
              data-target-x="0"
              data-target-y="310"
            >
              <span class="f06-node-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M 12 5 C 8 5, 8 9, 8 12 C 8 15, 5 16, 3 16 C 5 16, 8 17, 8 20 C 8 23, 8 27, 12 27" />
                  <path d="M 20 5 C 24 5, 24 9, 24 12 C 24 15, 27 16, 29 16 C 27 16, 24 17, 24 20 C 24 23, 24 27, 20 27" />
                </svg>
              </span>
              <span>API</span>
            </div>
          </div>

          <div id="f06-platform-final-line" class="f06-final-line">
            <span class="f06-final-accent" aria-hidden="true"></span>
            <span>One workspace</span>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({ paused: true });
        const connectorPaths = [
          document.getElementById("f06-platform-path-report"),
          document.getElementById("f06-platform-path-pdf"),
          document.getElementById("f06-platform-path-study"),
          document.getElementById("f06-platform-path-tools"),
          document.getElementById("f06-platform-path-api"),
        ];

        connectorPaths.forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = `${length}`;
          path.style.strokeDashoffset = `${length}`;
        });

        const ring = document.getElementById("f06-platform-hub-ring");
        const ringLength = ring.getTotalLength();
        ring.style.strokeDasharray = `${ringLength}`;
        ring.style.strokeDashoffset = `${ringLength}`;

        tl.fromTo(
          "#f06-platform-stage",
          { opacity: 0 },
          { opacity: 1, duration: 0.24, ease: "power2.out" },
          0,
        );

        tl.fromTo(
          "#f06-platform-camera",
          { scale: 1.14 },
          { scale: 1, duration: 1.4, ease: "power2.inOut" },
          0,
        );

        tl.to(
          "#f06-platform-report",
          { scale: 0.58, opacity: 0, duration: 0.5, ease: "power2.in" },
          0.45,
        );

        tl.fromTo(
          "#f06-platform-logo-state",
          { scale: 0.58, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.62,
            ease: "back.out(1.5)",
          },
          0.78,
        );

        tl.to(
          "#f06-platform-hub-ring",
          { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" },
          1.12,
        );

        tl.to(
          "#f06-platform-camera",
          { scale: 0.94, duration: 3.4, ease: "power1.inOut" },
          1.4,
        );

        const nodeSequence = [
          { id: "#f06-platform-node-report", path: "#f06-platform-path-report", at: 1.48 },
          { id: "#f06-platform-node-pdf", path: "#f06-platform-path-pdf", at: 2.12 },
          { id: "#f06-platform-node-study", path: "#f06-platform-path-study", at: 2.76 },
          { id: "#f06-platform-node-tools", path: "#f06-platform-path-tools", at: 3.4 },
          { id: "#f06-platform-node-api", path: "#f06-platform-path-api", at: 4.04 },
        ];

        nodeSequence.forEach((item) => {
          const node = document.querySelector(item.id);
          const targetX = Number(node.dataset.targetX);
          const targetY = Number(node.dataset.targetY);

          tl.to(
            item.path,
            { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
            item.at,
          );
          tl.fromTo(
            item.id,
            {
              xPercent: -50,
              yPercent: -50,
              x: 0,
              y: 0,
              scale: 0.48,
              opacity: 0,
            },
            {
              xPercent: -50,
              yPercent: -50,
              x: targetX,
              y: targetY,
              scale: 1,
              opacity: 1,
              duration: 0.84,
              ease: "power3.out",
            },
            item.at + 0.12,
          );
        });

        tl.fromTo(
          "#f06-platform-final-line",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
          4.8,
        );

        tl.fromTo(
          ".f06-final-accent",
          { scaleX: 0, transformOrigin: "50% 50%" },
          { scaleX: 1, duration: 0.4, ease: "power2.out" },
          4.92,
        );

        window.__timelines["06-platform"] = tl;
      </script>
    </template>
  </body>
</html>
