      <div

        data-start="0"

        data-width="1920"
        data-height="1080"
      >
        <div
          id="hf07-ground"
          class="clip hf07-ground"
          data-start="0"
          data-duration="5.5"
          data-track-index="0"

        ></div>

        <div
          id="hf07-clear-layer"

            <path class="hf07-connector" d="M 960 440 C 1210 330 1410 230 1680 198" />

                id="hf07-logo-mark"
                class="hf07-logo-mark"

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const root07 = document.querySelector('[data-composition-id="07-cta"]');
          const one07 = (selector) => root07.querySelector(selector);
          const all07 = (selector) => Array.from(root07.querySelectorAll(selector));
          const rule07 = one07('#hf07-lockup-rule');
          const ruleLength07 = rule07.getTotalLength();
          rule07.style.strokeDasharray = String(ruleLength07);
          rule07.style.strokeDashoffset = String(ruleLength07);

          const timeline07 = gsap.timeline({ paused: true });

          timeline07.set(
            [
              one07('#hf07-logo-mark'),
              ...all07('.hf07-wordmark-letter'),
              one07('#hf07-question'),
              one07('#hf07-url'),
              one07('#hf07-cta')
            ],
            { opacity: 0 },
            0
          );
          timeline07.set(one07('#hf07-logo-mark'), { scale: 0.94, y: 8 }, 0);

          const clearTargets07 = [
            { selector: '#hf07-node-report', x: -640, y: -20 },
            { selector: '#hf07-node-translation', x: 640, y: -20 },
            { selector: '#hf07-node-study', x: -760, y: 12 },
            { selector: '#hf07-node-tools', x: 760, y: 12 },
            { selector: '#hf07-node-api', x: 0, y: -280 }
          ];

          clearTargets07.forEach((target) => {
            timeline07.to(
              one07(target.selector),
              {
                x: target.x,
                y: target.y,
                opacity: 0,
                duration: 0.92,
                ease: 'power3.in'
              },
              0.08
            );
          });

          timeline07.to(
            all07('.hf07-connector'),
            { opacity: 0, duration: 0.48, ease: 'power2.in' },
            0.12
          );
          timeline07.to(
            one07('#hf07-origin'),
            { opacity: 0, scale: 0.62, duration: 0.42, ease: 'power2.in' },
            0.18
          );
          timeline07.to(
            one07('#hf07-clear-layer'),
            { opacity: 0, duration: 0.16, ease: 'power1.out' },
            1.02
          );

          timeline07.fromTo(
            one07('#hf07-logo-mark'),
            { opacity: 0, scale: 0.94, y: 8 },
            { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: 'power2.out', immediateRender: false },
            1.2
          );
          timeline07.fromTo(
            all07('.hf07-wordmark-letter'),
            { opacity: 0, x: 14 },
            {
              opacity: 1,
              x: 0,
              duration: 0.34,
              ease: 'power2.out',
              stagger: 0.09,
              immediateRender: false
            },
            1.66
          );
          timeline07.to(
            rule07,
            { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' },
            2.36
          );

          timeline07.fromTo(
            one07('#hf07-question'),
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.14, ease: 'power2.out', immediateRender: false },
            3.2
          );
          timeline07.fromTo(
            one07('#hf07-url'),
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.14, ease: 'power2.out', immediateRender: false },
            3.27
          );
          timeline07.fromTo(
            one07('#hf07-cta'),
            { opacity: 0, y: 8, scale: 0.98 },
            { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: 'power2.out', immediateRender: false },
            3.34
          );

          window.__timelines['07-cta'] = timeline07;
        })();
      </script>
