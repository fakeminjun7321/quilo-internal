<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.9"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.m4a"
        data-start="0"
        data-duration="4.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-input"
        class="scene"
        data-composition-id="02-input"
        data-composition-src="compositions/frames/02-input.html"
        data-start="4.5"
        data-duration="7"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-input-voice"
        src="assets/voice/02.m4a"
        data-start="4.5"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-analysis"
        class="scene"
        data-composition-id="03-analysis"
        data-composition-src="compositions/frames/03-analysis.html"
        data-start="11"
        data-duration="7.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-analysis-voice"
        src="assets/voice/03.m4a"
        data-start="11"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-data"
        class="scene"
        data-composition-id="04-data"
        data-composition-src="compositions/frames/04-data.html"
        data-start="18"
        data-duration="7.35"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-data-voice"
        src="assets/voice/04.m4a"
        data-start="18"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-report"
        class="scene"
        data-composition-id="05-report"
        data-composition-src="compositions/frames/05-report.html"
        data-start="25"
        data-duration="8.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-report-voice"
        src="assets/voice/05.m4a"
        data-start="25"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-platform"
        class="scene"
        data-composition-id="06-platform"
        data-composition-src="compositions/frames/06-platform.html"
        data-start="33"
        data-duration="6.9"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-platform-voice"
        src="assets/voice/06.m4a"
        data-start="33"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="39.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-cta-voice"
        src="assets/voice/07.m4a"
        data-start="39.5"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.5);
        tl.fromTo("#el-02-input", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.5);
        tl.to("#el-02-input", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 11);
        tl.fromTo("#el-03-analysis", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 11);
        tl.to("#el-03-analysis", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 18);
        tl.fromTo("#el-04-data", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 18);
        tl.to("#el-04-data", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-05-report", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 25);
        tl.to("#el-05-report", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 33);
        tl.fromTo("#el-06-platform", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 33);
        tl.to("#el-06-platform", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.4, ease: "power2.inOut" }, 39.5);
        tl.fromTo("#el-07-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.4, ease: "power2.inOut" }, 39.5);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
